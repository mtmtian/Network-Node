name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate deployment code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Ensure profiles remain local-only
        run: test -z "$(git ls-files profiles)"

      - name: Check shell syntax
        run: bash -n deploy.sh deploy-gcp.sh deploy-vps.sh core/*.sh providers/*.sh

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
